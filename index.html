<head>

<title>Xiang Wei</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bay-deep: #082a42; --bridge: #c8402e; --gutter: clamp(20px, 5vw, 64px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    position: relative; display: flex; align-items: flex-end;
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; color: #fff;
    background: var(--bay-deep); overflow: hidden;
  }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 40%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,42,66,.92) 0%, rgba(8,42,66,.5) 40%, rgba(8,42,66,0) 70%); }
  .wrap { position: relative; padding: 0 var(--gutter) 56px; max-width: 1120px; margin: 0 auto; width: 100%; }
  h1 { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-weight: 600; font-size: clamp(56px, 9vw, 128px); line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
  p { font-size: clamp(18px, 2vw, 22px); max-width: 44ch; margin: 18px 0 28px; color: rgba(255,255,255,.92); }
  nav { display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 18px; }
  nav a { color: #fff; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(255,255,255,.5); }
  nav a:hover { text-decoration-color: #fff; }
  nav a:focus-visible { outline: 3px solid var(--bridge); outline-offset: 3px; }
</style>
</head>
<body>
  <img src="pic/hero-bay.jpg" srcset="pic/hero-bay-960.jpg 960w, pic/hero-bay.jpg 1920w" sizes="100vw" alt="Stylized real-time render of San Francisco from above" fetchpriority="high">

    </nav>
  </div>
</body>
